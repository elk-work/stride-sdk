[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elk-stride-sdk"
version = "0.1.0"
description = "Stride observation emitter (stdlib only)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["observability", "telemetry", "tracing", "stride"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/elk-work/stride-sdk"
Source = "https://github.com/elk-work/stride-sdk"
Issues = "https://github.com/elk-work/stride-sdk/issues"

[tool.setuptools]
packages = ["elk_stride"]
